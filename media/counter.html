<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>While you read this tweet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..900,0..100&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #f3eee4; }
  canvas { display: block; }
  .warm { position: absolute; left: -9999px; font-family: Fraunces; font-weight: 700; }
  .warm2 { position: absolute; left: -9999px; font-family: Inter; font-weight: 600; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1350"></canvas>
<div class="warm">0123456789,</div><div class="warm2">0123456789</div>
<script>
const W = 1080, H = 1350;
const PAPER = '#f3eee4', INK = '#15120e', MUTED = '#6f6960', ACCENT = '#d2501c';
const RATE = 9508;             // payments per second, NPCI October 2026
const CR_RATE = 1.18;          // crore rupees per second
const PER_DOT = 4;             // payments per dot
const UPDATE_EVERY = 1.0;      // seconds between number re-cuts
const COUNT_UNTIL = 7.0;
const DURATION = 8.8;
const CELL = 7, INSET = 44;
const COLS = Math.floor((W - 2 * INSET) / CELL), ROWS = Math.floor((H - 2 * INSET) / CELL);
const X0 = INSET + ((W - 2 * INSET) - COLS * CELL) / 2, YB = H - INSET;   // left edge, bottom edge
const COLORS = [ACCENT, ACCENT, ACCENT, ACCENT, '#e8662f', '#e8662f', INK, '#6f6960', '#b9b1a2', '#f2a57c'];
const NUM_FONT = '700 300px Fraunces', NUM_X = 76, NUM_BASE = 980;

let seed = 11; const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
const c = document.getElementById('c'), ctx = c.getContext('2d');
const off = document.createElement('canvas'); off.width = W; off.height = H; const octx = off.getContext('2d', { willReadFrequently: true });
const fmt = n => n.toLocaleString('en-IN');

// stencil: masked[cx][row] is 1 where the digits are; dots there are not drawn, the pile itself stays level
let masked = [];
function cutNumber(str) {
  octx.clearRect(0, 0, W, H); octx.font = NUM_FONT; octx.fillStyle = '#000'; octx.letterSpacing = '-0.01em';
  octx.fillText(str, NUM_X, NUM_BASE);
  const img = octx.getImageData(0, 0, W, H).data; masked = [];
  for (let cx = 0; cx < COLS; cx++) {
    const m = new Uint8Array(ROWS + 4); const px = Math.round(X0 + cx * CELL + CELL / 2);
    for (let r = 0; r < ROWS; r++) { const py = Math.round(YB - r * CELL - CELL / 2); m[r] = img[(py * W + px) * 4 + 3] > 110 ? 1 : 0; }
    masked.push(m);
  }
}
const hidden = (cx, y) => { const r = Math.round((YB - y - CELL / 2) / CELL); return r >= 0 && r < ROWS && masked[cx][r] === 1; };

const dots = []; const colCount = new Array(COLS).fill(0);
function slotY(cx, rank) { return YB - rank * CELL - CELL / 2; }
function pickCol() { let best = -1, bh = 1e9; for (let i = 0; i < 3; i++) { const cx = Math.floor(rnd() * COLS); if (colCount[cx] < bh) { bh = colCount[cx]; best = cx; } } return best; }
function spawn() {
  const cx = pickCol(); const rank = colCount[cx]++;
  const offs = (rank % 2 ? 0.5 : -0.5) * 1.2;
  dots.push({ cx, rank, x: X0 + cx * CELL + CELL / 2 + offs + (rnd() - .5) * 1.5, y: -12 - rnd() * 80, ty: slotY(cx, rank), vy: 2 + rnd() * 3, settled: false, col: COLORS[Math.floor(rnd() * COLORS.length)], r: 2.6 + rnd() * 0.7 });
}

let T = 0, shown = '', lastKey = -1, spawned = 0;
function step(dt) {
  T += dt; const tc = Math.min(T, COUNT_UNTIL);
  const key = T >= COUNT_UNTIL ? -2 : Math.floor(tc / UPDATE_EVERY);
  if (key !== lastKey) { lastKey = key; shown = fmt(Math.floor(RATE * (T >= COUNT_UNTIL ? COUNT_UNTIL : key * UPDATE_EVERY))); cutNumber(shown); }
  const want = Math.floor(RATE * tc / PER_DOT); while (spawned < want) { spawn(); spawned++; }
  for (const d of dots) {
    if (!d.settled) { d.vy += 1.9; d.y += d.vy; if (d.y >= d.ty) { d.y = d.ty; d.settled = true; } }
    else if (Math.abs(d.ty - d.y) > 0.3) { d.y += (d.ty - d.y) * 0.28; } else d.y = d.ty;
  }
}

function render() {
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
  for (const d of dots) { if (hidden(d.cx, d.y)) continue; ctx.fillStyle = d.col; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill(); }
  ctx.lineWidth = 1; for (const d of dots) { if (d.settled || hidden(d.cx, d.y)) continue; ctx.strokeStyle = d.col; ctx.globalAlpha = 0.35; ctx.beginPath(); ctx.moveTo(d.x, d.y - d.vy * 1.8); ctx.lineTo(d.x, d.y); ctx.stroke(); }
  ctx.globalAlpha = 1;
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  ctx.font = '600 24px Inter'; ctx.letterSpacing = '0.18em'; ctx.fillStyle = MUTED; ctx.fillText('WHILE YOU READ THIS TWEET', 80, 150); ctx.letterSpacing = '0px';
  ctx.font = '600 66px Fraunces'; ctx.fillStyle = INK; ctx.fillText('this many UPI payments', 80, 238); ctx.fillText('happened.', 80, 312);
  const tt = Math.min(T, COUNT_UNTIL);
  ctx.font = '400 28px Inter'; ctx.fillStyle = MUTED;
  ctx.fillText(`Each dot is ${PER_DOT} payments. ₹${(CR_RATE * tt).toFixed(1)} crore moved so far.`, 80, 372);
  ctx.font = '500 24px Inter'; ctx.fillStyle = INK; ctx.fillText('now.harssha.design/upi-study', 80, 416);
  const mm = Math.floor(tt / 60), ss = Math.floor(tt % 60), ds = Math.floor((tt * 10) % 10);
  ctx.font = '500 30px Inter'; ctx.fillStyle = T >= COUNT_UNTIL ? ACCENT : INK; ctx.textAlign = 'right'; ctx.fontVariantNumeric = 'tabular-nums';
  ctx.fillText(`${mm}:${String(ss).padStart(2, '0')}.${ds}`, W - 80, 154); ctx.textAlign = 'left';
  ctx.strokeStyle = 'rgba(21,18,14,0.14)'; ctx.lineWidth = 1; ctx.strokeRect(INSET - 8, INSET - 8, W - 2 * INSET + 16, H - 2 * INSET + 16);
}

window.__ready = document.fonts.ready.then(() => { cutNumber('0'); render(); return true; });
window.__frame = dt => { step(dt); render(); return `${shown} dots=${dots.length}`; };
window.DURATION = DURATION;
if (!navigator.webdriver) window.__ready.then(() => { let last = performance.now(); const loop = now => { const dt = Math.min(0.05, (now - last) / 1000); last = now; if (T < DURATION) window.__frame(dt); requestAnimationFrame(loop); }; requestAnimationFrame(loop); });
</script>
</body>
</html>
